name: Nocion Therapeutics
description: >-
  Nocion Therapeutics is a clinical-stage biopharmaceutical company discovering
  and developing a novel class of biologically selective charged sodium channel
  (NaV) blockers designed to selectively silence overactive sensory neurons to
  relieve chronic cough, pain, itch, and inflammation. Its lead candidate,
  inhaled taplucainium, is a first-in-class therapy in a Phase 2b (ASPIRE) trial
  for refractory and unexplained chronic cough, with topline results expected in
  2026. Founded on foundational intellectual property licensed from Harvard
  University and Boston Children's Hospital and backed by Canaan Partners,
  F-Prime Capital, and other life-sciences investors, Nocion is a therapeutics
  R&D company with no public developer API surface.
